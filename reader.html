<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المقاصد عند الإمام الشاطبي</title>
<script>
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem('maqasid')) || {}; } catch (e) {}
    var theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    var m = location.hash.match(/^#(ar|en)/);
    var lang = m ? m[1] : (s.lang === 'en' ? 'en' : 'ar');
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    if (s.fontScale) document.documentElement.style.setProperty('--font-scale', s.fontScale);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7d4deddb2b">
</head>
<body class="reader-page">
<header class="topbar">
  <a id="home" class="btn icon-btn" href="./">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
  </a>
  <button id="contents-btn" class="btn contents-btn" type="button" aria-haspopup="dialog" aria-controls="contents">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    <span class="contents-label"></span>
  </button>
  <span class="spacer"></span>
  <button id="lang-toggle" class="btn" type="button"></button>
  <button id="theme-toggle" class="btn icon-btn" type="button">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main id="reader" class="reader"></main>

<dialog id="contents" class="contents-panel" aria-labelledby="contents-title">
  <div class="contents-head">
    <h2 id="contents-title" class="contents-title"></h2>
    <button id="contents-close" class="btn icon-btn" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form id="page-jump" class="page-jump">
    <label for="page-input" class="page-jump-label"></label>
    <input id="page-input" class="page-input" type="number" inputmode="numeric" min="1" required>
    <span class="page-total"></span>
    <button type="submit" class="btn btn-primary page-go"></button>
  </form>
  <ol id="contents-list" class="contents-list"></ol>
</dialog>

<template id="en-note-template">
  <p class="en-note" lang="en" dir="ltr">
    This English translation was machine-generated by OpenAI and may contain errors. The original Arabic text is authoritative.
  </p>
</template>

<nav class="bottombar">
  <button id="prev" class="btn" type="button">
    <svg class="icon icon-dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="label"></span>
  </button>
  <div class="font-controls">
    <span id="counter" class="counter"></span>
    <div class="font-size" dir="ltr">
      <button id="font-down" class="btn" type="button"><span aria-hidden="true">−</span></button>
      <button id="font-up" class="btn" type="button"><span aria-hidden="true">+</span></button>
    </div>
  </div>
  <button id="next" class="btn" type="button">
    <span class="label"></span>
    <svg class="icon icon-dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</nav>

<script src="assets/book.js?v=7d4deddb2b"></script>
<script src="assets/common.js?v=7d4deddb2b"></script>
<script src="assets/reader.js?v=7d4deddb2b"></script>
<script src="assets/size-tip.js?v=7d4deddb2b"></script>
</body>
</html>
